name: Issues 28 and 29 Python evidence
on:
  pull_request:
    paths:
      - 'validation/issue28_d05a_python_analysis_20261017/**'
      - 'validation/issue29_p06n_python_evidence_20261017/**'
      - '.github/workflows/issues28-29-python-evidence.yml'
  workflow_dispatch:
jobs:
  saved-vectors-and-diagnostic-packages:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install the recorded numerical dependencies
        run: python -m pip install -r validation/issue29_p06n_python_evidence_20261017/requirements.txt
      - name: Check dedicated ZIP bytes and CRC
        run: |
          python -B -X utf8 validation/issue29_p06n_python_evidence_20261017/PACKAGE.py --check
          python -B -X utf8 validation/issue28_d05a_python_analysis_20261017/PACKAGE.py --check
      - name: Reassemble P06N original q8 fields and upper original dual
        run: python -B -X utf8 validation/issue29_p06n_python_evidence_20261017/VERIFY.py --output "$env:RUNNER_TEMP/P06N_REAUDIT.json"
      - name: Reaudit all six D05A scaling diagnostics without optimization
        run: python -B -X utf8 validation/issue28_d05a_python_analysis_20261017/VERIFY_MICRO.py --output "$env:RUNNER_TEMP/D05A_MICRO_REAUDIT.json"
      - name: Reaudit D05A historical pair and raw dual acceptance and rejection
        run: python -B -X utf8 validation/issue28_d05a_python_analysis_20261017/VERIFY_HISTORICAL.py --output "$env:RUNNER_TEMP/D05A_HISTORICAL_REAUDIT.json"
